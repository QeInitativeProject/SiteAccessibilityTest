stages:
  - test
  - report
  - notify

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/ms-playwright"
  NODE_VERSION: "20"
  GIT_DEPTH: "1"
  GIT_STRATEGY: "fetch"
  ENV: "stage"  # Default environment - override at pipeline trigger time for qa/prod

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/
    - node_modules/
    - ms-playwright/
  policy: pull-push

# ==================== BASE TEMPLATE ====================
.test_base:
  image: mcr.microsoft.com/playwright:v1.57.0-jammy
  interruptible: true
  before_script:
    - echo "📦 Installing dependencies..."
    - npm ci --prefer-offline --no-audit || npm install --no-audit
    - echo "🎭 Installing Playwright..."
    - npx playwright install chromium --with-deps || true
    - npm run clear
  artifacts:
    when: always
    paths:
      - playwright-report/
      - playwright-report/test-summary.html
      - allure-results/
      - monocart-report/
      - test-results/
      - test-results/logs/
      - test-results/Failed_screenshots/
      - test-results/success-screenshots/
    expose_as: 'Test Report'
    expire_in: 7 days

# ==================== TEST TEMPLATES ====================
.smoke_test:
  extends: .test_base
  stage: test
  script:
    - echo "🧪 Running Smoke Tests on ${ENV} environment..."
    - npx playwright test --grep @smoke --workers=4
  when: manual
  # Removed job-level retry; Playwright will retry only failed tests
  allow_failure: true 

.regression_test:
  extends: .test_base
  stage: test
  script:
    - echo "🔬 Running Regression Tests on ${ENV} environment..."
    - npx playwright test --grep @regression --workers=100%
  when: manual
  # Removed job-level retry; Playwright will retry only failed tests
  allow_failure: true

# ==================== SUITE-LEVEL JOBS (Run All Tests by Environment) ====================

# ==================== AUTO-TRIGGERED ON MERGE TO MAIN ====================
ATI_Regression_OnMerge_Main:
  extends: .test_base
  stage: test
  variables:
    ENV: "stage"
  script:
    - echo "🔬 Running Regression Tests (triggered by merge to main)..."
    - npx playwright test --grep @regression src/test/TestScript/Regression --workers=100%
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: always
  allow_failure: true

# ==================== AUTO-TRIGGERED BY UPSTREAM DEV PIPELINE ====================
ATI_Smoke_Stage:
  extends: .test_base
  stage: test
  variables:
    ENV: "stage"
  script:
    - npx playwright test --grep @smoke src/test/TestScript/Smoke-Stage --workers=4
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"  # Triggered by upstream multi-project pipeline
  allow_failure: true 

ATI_Regression_Stage_Manual:
  extends: .test_base
  stage: test
  variables:
    ENV: "stage"
  script:
    - npx playwright test --grep @regression src/test/TestScript/Regression --workers=100%
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: manual
  allow_failure: true 

# ==================== MANUAL JOBS (Run on demand) ====================
smoke:qa:
  extends: .smoke_test
  variables:
    ENV: "qa"

smoke:stage:
  extends: .smoke_test
  variables:
    ENV: "stage"
  script:
    - echo "🧪 Running Smoke Tests on ${ENV} environment (Smoke-Stage folder only)..."
    - npx playwright test --grep @smoke src/test/TestScript/Smoke-Stage --workers=4
  when: manual

smoke:prod:
  extends: .test_base
  stage: test
  variables:
    ENV: "prod"
  script:
    - echo "🧪 Running Smoke Tests on ${ENV} environment (Smoke_Prod folder only)..."
    - npx playwright test src/test/TestScript/Smoke_Prod --workers=4
  when: manual
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  allow_failure: true 

regression:stage:
  extends: .regression_test
  variables:
    ENV: "stage"
  script:
    - echo "🔬 Running Regression Tests on ${ENV} environment (Regression folder only)..."
    - npx playwright test --grep @regression  src/test/TestScript/Regression --workers=100%
  when: manual

