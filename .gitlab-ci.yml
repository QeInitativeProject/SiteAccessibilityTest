# ==================== CONSOLIDATED REPORT ====================
consolidated_report:
  stage: report
  image: mcr.microsoft.com/playwright:v1.57.0-jammy
  script:
    - echo "📊 Consolidating all test reports..."
    - echo "🔍 Searching for test reports from any completed jobs..."
    - ls -la || true
    - mkdir -p public
    - |
      # Find and copy ANY monocart or playwright reports from completed jobs
      find . -maxdepth 2 -name "monocart-report" -type d 2>/dev/null | while read reportdir; do
        echo "✅ Found monocart report at: $reportdir"
        cp -r "$reportdir" public/ 2>/dev/null || true
      done
      
      find . -maxdepth 2 -name "playwright-report" -type d 2>/dev/null | while read reportdir; do
        echo "✅ Found playwright report at: $reportdir"
        cp -r "$reportdir" public/ 2>/dev/null || true
      done
      
      # Fallback: check current directory
      for dir in monocart-report playwright-report; do
        if [ -d "$dir" ]; then
          echo "✅ Found $dir in current directory, copying..."
          cp -r "$dir" public/ 2>/dev/null || true
        fi
      done
    - |
      cat > public/index.html << 'EOF'
      <!DOCTYPE html>
      <html>
      <head>
        <title>Test Reports</title>
        <meta http-equiv="refresh" content="0; url=monocart-report/index.html">
        <style>
          body { 
            font-family: Arial, sans-serif; 
            margin: 40px; 
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
          }
          .loading { margin-top: 100px; font-size: 24px; }
          a { color: #ffd700; text-decoration: none; }
        </style>
      </head>
      <body>
        <div class="loading">
          <h1>🚀 Redirecting to Test Report...</h1>
          <p>If not redirected, <a href="monocart-report/index.html">click here</a></p>
        </div>
      </body>
      </html>
      EOF
    - echo "✅ Consolidated report ready!"
  artifacts:
    when: always
    paths:
      - public/
    expose_as: 'Consolidated Report'
    expire_in: 30 days
    name: "reports-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}"
  rules:
    - when: always  # Run after ANY job in previous stage completes
  allow_failure: true

# ==================== ALLURE REPORT ====================
allure_report:
  stage: report
  image: mcr.microsoft.com/playwright:v1.57.0-jammy
  needs:
    - job: ATI_Regression_OnMerge_Main
      artifacts: true
      optional: true
    - job: ATI_Smoke_Stage
      artifacts: true
      optional: true
    - job: ATI_Regression_Stage_Manual
      artifacts: true
      optional: true
    - job: smoke:qa
      artifacts: true
      optional: true
    - job: smoke:stage
      artifacts: true
      optional: true
    - job: smoke:prod
      artifacts: true
      optional: true
    - job: regression:stage
      artifacts: true
      optional: true
  before_script:
    - apt-get update && apt-get install -y default-jre-headless
  script:
    - echo "📊 Collecting allure-results from all test jobs..."
    - test -d "allure-results" && ls allure-results/*-result.json >/dev/null 2>&1 || { mkdir -p allure-results && echo '{"name":"No tests ran","status":"skipped","start":0,"stop":0}' > allure-results/empty-result.json && echo "⚠️ No allure-results found. Created placeholder."; }
    - echo "✅ allure-results found $(ls allure-results/*-result.json | wc -l) result files"
    - echo "📊 Generating Single-File Allure Report..."
    - npm install -g allure-commandline --save-dev 2>/dev/null || true
    - allure generate allure-results --clean --single-file -o allure-report || npx allure generate allure-results --clean --single-file -o allure-report
    - echo "✅ Allure single-page report generated at allure-report/index.html"
  artifacts:
    when: always
    paths:
      - allure-report/index.html
      - allure-results/
    expose_as: 'Allure Report'
    expire_in: 30 days
  rules:
    - when: always
  allow_failure: true

# ==================== EMAIL NOTIFICATION ====================
notify:email:
  stage: notify
  image: alpine:latest
  needs:
    - job: allure_report
      artifacts: true
  before_script:
    - apk add --no-cache curl jq bc || true
  script:
    - |
      echo "📧 Sending notifications..."
      REPORT_URL="${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/file/allure-report/index.html?job=allure_report"
      PIPELINE_URL="${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID}"
      TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
      PAGE_TITLE="Test Report - ${CI_COMMIT_REF_NAME} - Pipeline #${CI_PIPELINE_ID} - ${TIMESTAMP}"

      # --- Upload to Confluence ---
      echo "📄 Uploading report to Confluence..."
      
      # Parse allure-results to build test results table
      TOTAL=0; PASSED=0; FAILED=0; BROKEN=0; SKIPPED=0
      TEST_ROWS=""
      for f in allure-results/*-result.json; do
        [ -f "$f" ] || continue
        NAME=$(jq -r '.name // "Unknown"' "$f")
        STATUS=$(jq -r '.status // "unknown"' "$f")
        DURATION_MS=$(jq -r '.stop - .start // 0' "$f" 2>/dev/null || echo "0")
        DURATION_S=$(echo "scale=1; ${DURATION_MS}/1000" | bc 2>/dev/null || echo "0")
        
        TOTAL=$((TOTAL + 1))
        case "$STATUS" in
          passed) PASSED=$((PASSED + 1)); STATUS_ICON="✅" ;;
          failed) FAILED=$((FAILED + 1)); STATUS_ICON="❌" ;;
          broken) BROKEN=$((BROKEN + 1)); STATUS_ICON="⚠️" ;;
          skipped) SKIPPED=$((SKIPPED + 1)); STATUS_ICON="⏭️" ;;
          *) STATUS_ICON="❓" ;;
        esac
        
        TEST_ROWS="${TEST_ROWS}<tr><td>${NAME}</td><td>${STATUS_ICON} ${STATUS}</td><td>${DURATION_S}s</td></tr>"
      done

      # Build the page body with enhanced Confluence UI
      PASS_RATE=0
      if [ "$TOTAL" -gt 0 ]; then
        PASS_RATE=$(echo "scale=0; ${PASSED}*100/${TOTAL}" | bc 2>/dev/null || echo "0")
      fi

      if [ "$FAILED" -eq 0 ] && [ "$BROKEN" -eq 0 ]; then
        STATUS_COLOR="Green"
        STATUS_TITLE="ALL TESTS PASSED"
      elif [ "$PASS_RATE" -ge 80 ]; then
        STATUS_COLOR="Yellow"
        STATUS_TITLE="SOME TESTS FAILED"
      else
        STATUS_COLOR="Red"
        STATUS_TITLE="CRITICAL - MANY FAILURES"
      fi

      PAGE_BODY='<h2>Test Execution Summary</h2><table><tbody><tr><th style="text-align:center;background:#f4f5f7">Total</th><th style="text-align:center;background:#e3fcef">Passed</th><th style="text-align:center;background:#ffebe6">Failed</th><th style="text-align:center;background:#fffae6">Broken</th><th style="text-align:center;background:#f4f5f7">Skipped</th></tr><tr><td style="text-align:center"><strong>'"${TOTAL}"'</strong></td><td style="text-align:center"><strong>'"${PASSED}"'</strong></td><td style="text-align:center"><strong>'"${FAILED}"'</strong></td><td style="text-align:center"><strong>'"${BROKEN}"'</strong></td><td style="text-align:center"><strong>'"${SKIPPED}"'</strong></td></tr></tbody></table><h2>Pipeline Info</h2><table><tbody><tr><th>Pipeline</th><td><a href="'"${PIPELINE_URL}"'">#'"${CI_PIPELINE_ID}"' (Click to open in GitLab)</a></td></tr><tr><th>Branch</th><td>'"${CI_COMMIT_REF_NAME}"'</td></tr><tr><th>Triggered by</th><td>'"${GITLAB_USER_NAME}"'</td></tr><tr><th>Timestamp</th><td>'"${TIMESTAMP}"'</td></tr><tr><th>Pass Rate</th><td>'"${PASS_RATE}"'%</td></tr></tbody></table><h2>Test Results Detail</h2><table><tbody><tr><th>Test Name</th><th>Status</th><th>Duration</th></tr>'"${TEST_ROWS}"'</tbody></table>'

      # Create the page using jq to build valid JSON
      JSON_PAYLOAD=$(jq -n \
        --arg type "page" \
        --arg title "$PAGE_TITLE" \
        --arg space "$CONFLUENCE_SPACE_KEY" \
        --arg ancestor "$CONFLUENCE_PARENT_PAGE_ID" \
        --arg body "$PAGE_BODY" \
        '{type: $type, title: $title, ancestors: [{id: ($ancestor | tonumber)}], space: {key: $space}, body: {storage: {value: $body, representation: "storage"}}}')

      RESPONSE=$(curl --silent --request POST \
        --url "${CONFLUENCE_URL}/rest/api/content" \
        --user "${CONFLUENCE_USER}:${CONFLUENCE_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "$JSON_PAYLOAD")
      
      PAGE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
      
      if [ -n "$PAGE_ID" ]; then
        echo "✅ Confluence page created: ${PAGE_ID}"
        CONFLUENCE_PAGE_URL="${CONFLUENCE_URL}/spaces/${CONFLUENCE_SPACE_KEY}/pages/${PAGE_ID}"
        
        # Attach the Allure report HTML to the page
        if [ -f "allure-report/index.html" ]; then
          ATTACH_RESPONSE=$(curl --silent --request POST \
            --url "${CONFLUENCE_URL}/rest/api/content/${PAGE_ID}/child/attachment" \
            --user "${CONFLUENCE_USER}:${CONFLUENCE_TOKEN}" \
            --header "X-Atlassian-Token: nocheck" \
            --form "file=@allure-report/index.html" \
            --form "comment=Allure Report - Pipeline #${CI_PIPELINE_ID}")
          
          ATTACH_LINK=$(echo "$ATTACH_RESPONSE" | jq -r '.results[0]._links.download // empty')
          if [ -n "$ATTACH_LINK" ]; then
            echo "✅ Report attached: ${CONFLUENCE_URL}${ATTACH_LINK}"
          else
            echo "⚠️ Attachment response: $ATTACH_RESPONSE"
          fi
        fi
      else
        echo "⚠️ Could not create Confluence page: $RESPONSE"
        CONFLUENCE_PAGE_URL="N/A"
      fi

      # --- Post GitLab commit comment ---
      echo "💬 Posting GitLab commit comment..."
      curl --request POST \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/commits/${CI_COMMIT_SHA}/comments" \
        --form "note=## 📊 Test Execution Complete
      
      **Pipeline:** [#${CI_PIPELINE_ID}](${PIPELINE_URL})  
      **Branch:** ${CI_COMMIT_REF_NAME}  
      **Allure Report:** [Download Report](${REPORT_URL})  
      **Confluence:** [View on Confluence](${CONFLUENCE_PAGE_URL})  
      **Triggered by:** ${GITLAB_USER_NAME}
      " || echo "⚠️ Could not post comment via API"
      
      echo "✅ All notifications sent!"
      echo "📊 Allure Report: ${REPORT_URL}"
      echo "📄 Confluence: ${CONFLUENCE_PAGE_URL}"
      echo "🔗 Pipeline: ${PIPELINE_URL}"
  rules:
    - when: always
  allow_failure: true

# ==================== WORKFLOW RULES ====================
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
      when: always
