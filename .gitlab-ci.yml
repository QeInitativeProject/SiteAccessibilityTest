# ==================== CONSOLIDATED REPORT ====================
consolidated_report:
  stage: report
  image: mcr.microsoft.com/playwright:v1.57.0-jammy
  script:
    - echo "📊 Consolidating all test reports..."
    - echo "🔍 Searching for test reports from any completed jobs..."
    - ls -la || true
    - mkdir -p public
    - |
      # Find and copy ANY monocart or playwright reports from completed jobs
      find . -maxdepth 2 -name "monocart-report" -type d 2>/dev/null | while read reportdir; do
        echo "✅ Found monocart report at: $reportdir"
        cp -r "$reportdir" public/ 2>/dev/null || true
      done
      
      find . -maxdepth 2 -name "playwright-report" -type d 2>/dev/null | while read reportdir; do
        echo "✅ Found playwright report at: $reportdir"
        cp -r "$reportdir" public/ 2>/dev/null || true
      done
      
      # Fallback: check current directory
      for dir in monocart-report playwright-report; do
        if [ -d "$dir" ]; then
          echo "✅ Found $dir in current directory, copying..."
          cp -r "$dir" public/ 2>/dev/null || true
        fi
      done
    - |
      cat > public/index.html << 'EOF'
      <!DOCTYPE html>
      <html>
      <head>
        <title>Test Reports</title>
        <meta http-equiv="refresh" content="0; url=monocart-report/index.html">
        <style>
          body { 
            font-family: Arial, sans-serif; 
            margin: 40px; 
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
          }
          .loading { margin-top: 100px; font-size: 24px; }
          a { color: #ffd700; text-decoration: none; }
        </style>
      </head>
      <body>
        <div class="loading">
          <h1>🚀 Redirecting to Test Report...</h1>
          <p>If not redirected, <a href="monocart-report/index.html">click here</a></p>
        </div>
      </body>
      </html>
      EOF
    - echo "✅ Consolidated report ready!"
  artifacts:
    when: always
    paths:
      - public/
    expose_as: 'Consolidated Report'
    expire_in: 30 days
    name: "reports-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}"
  rules:
    - when: always  # Run after ANY job in previous stage completes
  allow_failure: true

# ==================== ALLURE REPORT ====================
allure_report:
  stage: report
  image: mcr.microsoft.com/playwright:v1.57.0-jammy
  needs:
    - job: ATI_Regression_OnMerge_Main
      artifacts: true
      optional: true
    - job: ATI_Smoke_Stage
      artifacts: true
      optional: true
    - job: ATI_Regression_Stage_Manual
      artifacts: true
      optional: true
  script:
    - echo "📊 Generating Allure Report..."
    - npm install -g allure-commandline --save-dev || true
    - npx allure generate allure-results --clean -o public/allure-report
    - echo "✅ Allure report generated at public/allure-report"
  artifacts:
    when: always
    paths:
      - public/allure-report/
    expose_as: 'Allure Report'
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: always
    - when: manual
  allow_failure: true

# ==================== GITLAB PAGES - ALLURE ====================
pages:
  stage: report
  image: alpine:latest
  needs:
    - job: allure_report
      artifacts: true
  script:
    - echo "🌐 Publishing Allure report to GitLab Pages..."
    - mkdir -p public
    - |
      cat > public/index.html << 'EOF'
      <!DOCTYPE html>
      <html>
      <head>
        <title>Test Reports</title>
        <meta http-equiv="refresh" content="0; url=allure-report/index.html">
      </head>
      <body>
        <p>Redirecting to <a href="allure-report/index.html">Allure Report</a>...</p>
      </body>
      </html>
      EOF
    - echo "✅ Report will be live at: ${CI_PAGES_URL}"
  artifacts:
    paths:
      - public
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - when: manual
  allow_failure: true

# ==================== EMAIL NOTIFICATION ====================
notify:email:
  stage: notify
  image: alpine:latest
  needs:
    - job: allure_report
      artifacts: false
  before_script:
    - apk add --no-cache curl || true
  script:
    - |
      echo "📧 Sending email notification..."
      REPORT_URL="${CI_PAGES_URL}/allure-report/index.html"
      PIPELINE_URL="${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID}"
      
      # Use GitLab API to send notification (works without SMTP setup)
      curl --request POST \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/commits/${CI_COMMIT_SHA}/comments" \
        --form "note=## 📊 Test Execution Complete
        
      **Pipeline:** [#${CI_PIPELINE_ID}](${PIPELINE_URL})  
      **Branch:** ${CI_COMMIT_REF_NAME}  
      **Allure Report:** [View Report](${REPORT_URL})  
      **Triggered by:** ${GITLAB_USER_NAME}
      " || echo "⚠️ Could not post comment via API"
      
      echo "✅ Notification sent!"
      echo "📊 Allure Report URL: ${REPORT_URL}"
      echo "🔗 Pipeline URL: ${PIPELINE_URL}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: always
    - when: manual
  allow_failure: true

# ==================== WORKFLOW RULES ====================
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always