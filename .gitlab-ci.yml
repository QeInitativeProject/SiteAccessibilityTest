stages:
  - test
  - report

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/ms-playwright"
  NODE_VERSION: "20"
  GIT_DEPTH: "1"
  GIT_STRATEGY: "fetch"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/
    - node_modules/
    - ms-playwright/
  policy: pull-push

# ==================== BASE TEMPLATE ====================
.test_base:
  image: mcr.microsoft.com/playwright:v1.57.0-jammy
  interruptible: true
  before_script:
    - echo "📦 Installing dependencies..."
    - npm ci --prefer-offline --no-audit || npm install --no-audit
    - echo "🎭 Installing Playwright..."
    - npx playwright install chromium --with-deps || true
    - npm run clear
  artifacts:
    when: always
    paths:
      - playwright-report/
      - monocart-report/
      - test-results/
    expose_as: 'Test Report'
    expire_in: 7 days

# ==================== TEST TEMPLATES ====================
.smoke_test:
  extends: .test_base
  stage: test
  script:
    - echo "🧪 Running Smoke Tests on ${ENV} environment..."
    - npx playwright test --grep @smoke --workers=4
  when: manual
  # Removed job-level retry; Playwright will retry only failed tests
  allow_failure: false

.regression_test:
  extends: .test_base
  stage: test
  script:
    - echo "🔬 Running Regression Tests on ${ENV} environment..."
    - npx playwright test --grep @regression --workers=100%
  when: manual
  # Removed job-level retry; Playwright will retry only failed tests
  allow_failure: false

# ==================== SMOKE TEST JOBS ====================
smoke:qa:
  extends: .smoke_test
  variables:
    ENV: "qa"


# ==================== SMOKE-STAGE (Manual, Stage Only, Folder Restricted) ====================
smoke:stage:
  extends: .smoke_test
  variables:
    ENV: "stage"
  script:
    - echo "🧪 Running Smoke Tests on ${ENV} environment (Smoke-Stage folder only)..."
    - npx playwright test --grep @smoke src/test/TestScript/Smoke-Stage --workers=4
  when: manual


# ==================== REGRESSION TEST JOBS ====================

# ==================== REGRESSION (Manual, Stage Only, Folder Restricted) ====================
regression:stage:
  extends: .regression_test
  variables:
    ENV: "stage"
  script:
    - echo "🔬 Running Regression Tests on ${ENV} environment (Regression folder only)..."
    - npx playwright test --grep @regression --testDir src/test/TestScript/Regression --workers=100%
  when: manual

# ==================== SANITY-PROD (Manual, Prod Only, Folder Restricted) ====================
sanity:prod:
  extends: .test_base
  stage: test
  variables:
    ENV: "prod"
  script:
    - echo "🧪 Running Sanity Tests on ${ENV} environment (Sanity-Prod folder only)..."
    - npx playwright test --testDir src/test/TestScript/Sanity-Prod --workers=4
  when: manual
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  allow_failure: false

# ==================== CONSOLIDATED REPORT ====================
consolidated_report:
  stage: report
  image: mcr.microsoft.com/playwright:v1.57.0-jammy
  script:
    - echo "📊 Consolidating all test reports..."
    - echo "🔍 Searching for test reports from any completed jobs..."
    - ls -la || true
    - mkdir -p public
    - |
      # Find and copy ANY monocart or playwright reports from completed jobs
      find . -maxdepth 2 -name "monocart-report" -type d 2>/dev/null | while read reportdir; do
        echo "✅ Found monocart report at: $reportdir"
        cp -r "$reportdir" public/ 2>/dev/null || true
      done
      
      find . -maxdepth 2 -name "playwright-report" -type d 2>/dev/null | while read reportdir; do
        echo "✅ Found playwright report at: $reportdir"
        cp -r "$reportdir" public/ 2>/dev/null || true
      done
      
      # Fallback: check current directory
      for dir in monocart-report playwright-report; do
        if [ -d "$dir" ]; then
          echo "✅ Found $dir in current directory, copying..."
          cp -r "$dir" public/ 2>/dev/null || true
        fi
      done
    - |
      cat > public/index.html << 'EOF'
      <!DOCTYPE html>
      <html>
      <head>
        <title>Test Reports</title>
        <meta http-equiv="refresh" content="0; url=monocart-report/index.html">
        <style>
          body { 
            font-family: Arial, sans-serif; 
            margin: 40px; 
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
          }
          .loading { margin-top: 100px; font-size: 24px; }
          a { color: #ffd700; text-decoration: none; }
        </style>
      </head>
      <body>
        <div class="loading">
          <h1>🚀 Redirecting to Test Report...</h1>
          <p>If not redirected, <a href="monocart-report/index.html">click here</a></p>
        </div>
      </body>
      </html>
      EOF
    - echo "✅ Consolidated report ready!"
  artifacts:
    when: always
    paths:
      - public/
    expose_as: 'Consolidated Report'
    expire_in: 30 days
    name: "reports-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}"
  rules:
    - when: always  # Run after ANY job in previous stage completes
  allow_failure: true

# ==================== GITLAB PAGES (AUTO-HOST REPORT) ====================
pages:
  stage: report
  image: alpine:latest
  needs:
    - job: consolidated_report
      artifacts: true
  script:
    - echo "🌐 Publishing test reports to GitLab Pages..."
    - echo "✅ Report will be live at your project's Pages URL"
  artifacts:
    paths:
      - public
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "regression-automation"'
      when: on_success
    - when: never
  allow_failure: true

# ==================== WORKFLOW RULES ====================
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always